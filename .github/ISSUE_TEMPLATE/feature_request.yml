name: Feature request
description: Propose a focused capability or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the real document or workflow that needs this capability.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Example HTML/CSS
      description: Add a reduced example if possible.
