<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HTML → PDF Client — Live Demo</title>
<style>
  :root { --green: #289e22; --green-strong: #1f7a1c; --slate-100: #f1f5f9; --slate-300: #cbd5e1; --slate-700: #334155; --slate-900: #0f172a; }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 24px; max-width: 1400px; color: var(--slate-900); background: #fafafa; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px 0; }
  .sub { color: var(--slate-700); font-size: 13px; margin-bottom: 20px; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  button { padding: 10px 18px; font: inherit; background: var(--green); color: #fff; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
  button:hover { background: var(--green-strong); }
  button.secondary { background: #fff; color: var(--slate-900); border: 1px solid var(--slate-300); }
  button.secondary:hover { background: var(--slate-100); }
  button.active { background: var(--green); color: #fff; border-color: var(--green); }
  textarea { width: 100%; height: 180px; font: 12px ui-monospace, monospace; padding: 10px; border: 1px solid var(--slate-300); border-radius: 6px; }
  iframe { width: 100%; height: 75vh; border: 1px solid var(--slate-300); border-radius: 6px; margin-top: 12px; background: #fff; }
  #status { color: var(--slate-700); font-size: 12px; }
  #status.ok { color: var(--green-strong); font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  details summary { cursor: pointer; font-weight: 600; padding: 8px 0; }
</style>
</head>
<body>
  <h1>HTML → PDF Client — live demo</h1>
  <div class="sub">Vector-fidelity HTML → PDF. 100% client-side. No server, no third-party PDF generators.
   Inter font (Latin + Greek subsets) embedded as Type 0 / CIDFontType2.</div>

  <div class="controls">
    <span style="font-size:13px;color:var(--slate-700);font-weight:600;">Preset fixture:</span>
    <button class="secondary" data-fixture="source">source.html</button>
    <button class="secondary" data-fixture="source-flat">source-flat.html</button>
    <button class="secondary" data-fixture="wizard">wizard.html</button>
    <button class="secondary" data-fixture="report">report.html</button>
    <span style="flex:1;"></span>
    <button id="run">Convert ▸ PDF</button>
    <span id="status"></span>
  </div>

  <details>
    <summary>HTML source (editable)</summary>
    <textarea id="input">&lt;!-- HTML will load here when you click a fixture, or paste your own. --&gt;</textarea>
  </details>

  <iframe id="preview" title="PDF output"></iframe>

  <script type="module">
    import { htmlToPdf } from '../src/index.js';

    const FIXTURES = {
      'source':      { url: '../reference/source.html',      viewport: { width: 1123, height: 794  } },
      'source-flat': { url: '../reference/source-flat.html', viewport: { width: 1123, height: 794  } },
      'wizard':      { url: '../reference/wizard.html',      viewport: { width: 1600, height: 1280 } },
      'report':      { url: '../reference/report.html',      viewport: { width: 1123, height: 794  } },
    };
    let activeFixture = 'source';

    async function loadFixture(name) {
      activeFixture = name;
      document.querySelectorAll('[data-fixture]').forEach(b => b.classList.toggle('active', b.dataset.fixture === name));
      const text = await fetch(FIXTURES[name].url).then(r => r.text());
      document.getElementById('input').value = text;
    }

    async function convert() {
      const status = document.getElementById('status');
      status.classList.remove('ok');
      status.textContent = 'rendering…';
      const t0 = performance.now();
      const html = document.getElementById('input').value;
      const vp = (FIXTURES[activeFixture] && FIXTURES[activeFixture].viewport) || { width: 1123, height: 794 };
      try {
        const bytes = await htmlToPdf(html, { viewport: vp });
        const blob = new Blob([bytes], { type: 'application/pdf' });
        document.getElementById('preview').src = URL.createObjectURL(blob);
        status.classList.add('ok');
        status.textContent = `${(bytes.byteLength / 1024).toFixed(1)} KB · ${(performance.now() - t0).toFixed(0)} ms · viewport ${vp.width}×${vp.height}`;
      } catch (err) {
        status.textContent = 'error: ' + err.message;
        console.error(err);
      }
    }

    document.querySelectorAll('[data-fixture]').forEach(b => b.addEventListener('click', () => loadFixture(b.dataset.fixture)));
    document.getElementById('run').addEventListener('click', convert);

    // Auto-load source on first visit
    loadFixture('source');
  </script>
</body>
</html>
